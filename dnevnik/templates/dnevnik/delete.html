{% extends 'dnevnik/base.html' %}

{% block title %}Удаление записи{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-6">
        <div class="card shadow">
            <div class="card-header bg-danger text-white">
                <h3 class="card-title mb-0">
                    <i class="bi bi-exclamation-triangle"></i> Удаление записи
                </h3>
            </div>
            <div class="card-body text-center">
                <i class="bi bi-trash display-1 text-danger mb-3"></i>
                <h4>Вы уверены, что хотите удалить запись?</h4>
                <p class="lead">"{{ object.title }}"</p>
                <p class="text-muted">Это действие нельзя отменить.</p>
                
                <form method="post">
                    {% csrf_token %}
                    <div class="d-flex justify-content-center gap-2">
                        <a href="{% url 'dnevnik:diary_detail' object.pk %}" class="btn btn-secondary">
                            <i class="bi bi-arrow-left"></i> Отмена
                        </a>
                        <button type="submit" class="btn btn-danger">
                            <i class="bi bi-trash"></i> Удалить
                        </button>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
