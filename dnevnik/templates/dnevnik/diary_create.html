{% extends 'dnevnik/base.html' %}

{% block content %}
<div class="diary-create-container">
    <h1>📖 Создать новую запись в дневнике</h1>

    <form method="post" class="diary-form">
        {% csrf_token %}

        <div class="form-group">
            <label for="id_title">Заголовок записи:</label>
            <input type="text"
                   name="title"
                   id="id_title"
                   class="form-control"
                   placeholder="Введите заголовок вашей записи..."
                   value="{{ form.title.value|default:'' }}"
                   required>
            {% if form.title.errors %}
                <div class="error-message">{{ form.title.errors }}</div>
            {% endif %}
        </div>

        <div class="form-group">
            <label for="id_content">Содержание:</label>
            <textarea name="content"
                      id="id_content"
                      class="form-control"
                      placeholder="Опишите ваши мысли, события дня или важные моменты..."
                      rows="12"
                      required>{{ form.content.value|default:'' }}</textarea>
            {% if form.content.errors %}
                <div class="error-message">{{ form.content.errors }}</div>
            {% endif %}
        </div>

        <div class="form-actions">
            <button type="submit" class="btn btn-primary">
                💾 Сохранить запись
            </button>
            <a href="{% url 'dnevnik:list' %}" class="btn btn-secondary">
                ↩️ Вернуться к списку
            </a>
        </div>
    </form>
</div>

{% endblock %}
